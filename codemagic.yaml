workflows:
  build-apps:
    name: Build APK and IPA for Flet
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      python: 3.10
    scripts:
      - name: Install Dependencies
        script: |
          python3 -m pip install --upgrade pip
          pip3 install flet
      - name: Build Android APK
        script: |
          yes | flet build apk --module-name ubt_test
      - name: Build iOS IPA
        script: |
          yes | flet build ipa --module-name ubt_test -- --no-codesign
    artifacts:
      - build/apk/*.apk
      - build/ios/ipa/*.ipa
